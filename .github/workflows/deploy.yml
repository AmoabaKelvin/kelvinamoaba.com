name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e1c30154a387214494e77fad7672e39e
          CF_BUILD_ENV: ${{ secrets.CF_BUILD_ENV }}
          CONTRIB_GITHUB_PAT: ${{ secrets.CONTRIB_GITHUB_PAT }}
        run: |
          if [ -n "$CF_BUILD_ENV" ]; then
            printf '%s' "$CF_BUILD_ENV" > .env.ci
            set -a; . ./.env.ci; set +a
          fi
          # The home page is prerendered here, so the activity graph needs a
          # real token at build time. CF_BUILD_ENV only has a redacted one.
          if [ -n "$CONTRIB_GITHUB_PAT" ]; then
            export GITHUB_PAT="$CONTRIB_GITHUB_PAT"
          fi
          bun run deploy
